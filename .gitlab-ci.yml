################################################################################
# UIkit Admin: the drupal.org CI templates, plus the webship-js suite that
# installs Drupal with this theme as the administration theme and walks the
# back office, accessibility included.
################################################################################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # Build and test with Drupal 11.4 and PHP 8.4; the theme also allows 12.
  DRUPAL_CORE: "11.4.8"
  _TARGET_PHP: "8.4"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Also test with the next major Drupal version and the newest PHP.
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1

# Drupal 11.4.8 carries the fix for the Twig 3.30 escape TypeError
# (https://www.drupal.org/i/3625969), which 11.4.6 does not.
composer:
  variables:
    DRUPAL_CORE: "11.4.8"

.drupal-node-base:
  extends: .testing-job-base
  needs: [composer]
  # Playwright brings its own Chromium: only the database is needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USER: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    LAUNCH_URL: "http://localhost"
    DRUSH: "drush-www"
    DRUPAL_PROJECT_DIR: $CI_PROJECT_DIR
    FORCE_COLOR: "1"
    # The Basic page type comes from the core recipe the job applies.
    DRUPAL_SKIP_FIXTURES: "1"
  before_script:
    # Web server.
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    # Drupal, with the Basic page type the standard profile no longer ships.
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB
        --account-name=webmaster
        --account-pass=dD.123123ddd
        --site-name="UIkit Admin"
        -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/$_WEB_ROOT/core/recipes/page_content_type -y
    # This theme as the administration theme, content forms included.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT theme:enable uikit_admin -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.theme admin uikit_admin -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set node.settings use_admin_theme 1 -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # A test runner has no mail server: collect the mails instead of sending
    # them, so account actions log no error.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.mail interface.default test_mail_collector -y
    # Drush ran as root: give the files it created back to the web server, so
    # image styles and uploads can write their directories.
    - chown -R www-data:www-data $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    # Surface a server error before the browser suite runs.
    - 'curl -s -o /tmp/login.html -w "login page HTTP=%{http_code}\n" http://localhost/user/login || true'
    - '$CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT watchdog:show --count=25 --severity=Error --extended || true'
    # Drush as the web server user, for the fixture steps. runuser runs the
    # command itself, with no shell and no option parsing after "--", so every
    # argument reaches Drush as it was given, PHP code included.
    - |
      cat > /usr/local/bin/drush-www <<EOF
      #!/bin/sh
      exec runuser -u www-data -- env HOME=/tmp $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT --uri=http://localhost "\$@"
      EOF
    - chmod +x /usr/local/bin/drush-www
    # Node.js 22, which Cucumber needs.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    # The suite and its browser.
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    - corepack enable
    - yarn install
    - ./node_modules/.bin/playwright install --with-deps chromium

# The screens of the back office and their accessibility.
webship-js-test:
  extends: .drupal-node-base
  # The suite runs more than 200 scenarios in a browser, which takes longer
  # than the 30 minutes a runner allows a job. Three jobs, each with its own
  # site, share the feature files out between them (see cucumber.js).
  parallel: 3
  script:
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
    expire_in: 7 days
  allow_failure: false

# Drupal 12: let Composer install the contributed modules that do not declare
# ^12 yet.
composer (next major):
  variables:
    _LENIENT_ALLOW_LIST: 'ai,ai_agents,ai_assistant_api,ai_chatbot,ai_content_suggestions,ai_image_alt_text,ai_logging,ai_penpot,ai_playwright,ai_provider_anthropic,ai_provider_huggingface,ai_provider_ollama,ai_provider_openai,ai_provider_xai,ai_translate,antibot,autocomplete_deluxe,automatic_updates,better_exposed_filters,captcha,coffee,config_filter,config_ignore,config_import_single,config_rewrite,config_split,config_update,config_update_ui,consumers,crop,ctools,dashboards,display_builder,display_builder_entity_view,display_builder_page_layout,display_builder_ui,display_builder_views,drupical,easy_breadcrumb,easy_encryption,editor_advanced_link,embed,entity_embed,field_group,field_validation,flood_control,focal_point,friendlycaptcha,gemini_provider,google_analytics,google_tag,honeypot,inline_entity_form,jsonapi_extras,key,klaro,login_emailusername,manage_display,media_directories_editor,media_directories_ui,media_remote_audio,media_remote_image,metatag,openapi,openapi_jsonapi,openapi_rest,openapi_ui,openapi_ui_swagger,pathauto,recaptcha_v3,redirect,restui,sam,schema_metatag,schemata,schemata_json_schema,seckit,security_review,shield,simple_oauth,smart_trim,tagify,token,token_filter,tracker,user_redirect,view_password,views_bulk_edit,views_bulk_operations,webform,xmlsitemap,yoast_seo'
