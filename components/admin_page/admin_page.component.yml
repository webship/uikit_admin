      title: Container
      description: "The width of the page."
      type: string
      enum:
        - default
        - xsmall
        - small
        - large
        - xlarge
        - expand
      "meta:enum":
        default: 'Default (Default)'
        xsmall: X-Small
        small: Small
        large: Large
        xlarge: X-Large
        expand: 'Full width'
