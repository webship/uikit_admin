name: "(Table cell)"
description: "One cell of a table_row component: a data cell or a header cell."
group: "Data display"
links:
  - "https://getuikit.com/docs/table"
slots:
  content:
    title: Content
    description: "What the cell holds."
props:
  type: object
  properties:
    tag:
      title: "Cell type"
      description: "td for data, th for a header."
      type: string
      enum:
        - td
        - th
      "meta:enum":
        td: "Data (Default)"
        th: Header
    width:
      title: Width
      description: "The width of the column of the cell."
      type: string
      enum:
        - shrink
        - expand
        - small
        - medium
        - large
      "meta:enum":
        shrink: "Shrink to content"
        expand: "Expand"
        small: "Small (150px)"
        medium: "Medium (300px)"
        large: "Large (450px)"
