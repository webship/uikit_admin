name: Table
description: "A UIkit table: the header, the rows and the footer are table_row components, each cell a table_cell. The administration listings of core print through it."
group: "Data display"
links:
  - "https://getuikit.com/docs/table"
variants:
  default:
    title: Default
    description: "No lines between the rows."
  divider:
    title: Divider
    description: "A line between the rows: the look of the listings of the back office."
  striped:
    title: Striped
    description: "Every other row on the muted background."
slots:
  colgroups:
    title: "Column groups"
    description: "The colgroup elements of the table, when core prints some."
  header:
    title: Header
    description: "Table rows with header cells."
    expected:
      - "uikit_admin:table_row"
  rows:
    title: Rows
    description: "The rows of the table body."
    expected:
      - "uikit_admin:table_row"
  footer:
    title: Footer
    description: "The rows of the table foot."
    expected:
      - "uikit_admin:table_row"
props:
  type: object
  properties:
    caption:
      title: Caption
      description: "The name of the table, printed above it."
      type: string
    caption_id:
      title: "Caption id"
      description: "The id of the caption, so a scroll box around the table can take its name."
      type: string
    hover:
      title: "Hover effect"
      description: "Highlight the row under the pointer."
      type: boolean
    size:
      title: "Cell padding"
      description: "Smaller or larger padding in the cells."
      type: string
      enum:
        - small
        - large
      "meta:enum":
        small: Small
        large: Large
    justify:
      title: Justify
      description: "Remove the outer padding of the first and last columns."
      type: boolean
    middle:
      title: "Vertically centered cells"
      description: "Center the content of each cell vertically."
      type: boolean
    responsive:
      title: "Stacked on small screens"
      description: "Stack the cells of a row on a phone."
      type: boolean
    overflow:
      title: "Horizontal scroll"
      description: "Wrap the table in a scrollable container."
      type: boolean
