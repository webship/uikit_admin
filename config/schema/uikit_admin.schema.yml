# Schema for the configuration files of the UIkit Admin theme.
#
# Each setting says what it does and which values it takes, so a person, a
# recipe or an assistant can set it without reading the code. The colors and
# the other design tokens are not settings of their own: they are stored in
# the keys of UI Skins (third_party_settings.ui_skins.css_variables), under
# the names of uikit_admin.ui_skins.css_variables.yml.

uikit_admin.settings:
  type: theme_settings
  label: 'UIkit Admin settings'
  mapping:
    htmx_navigation:
      type: boolean
      label: 'Navigate with HTMX'
      description: 'True: links, pagers, sorting and filters load only the page, and the rail and the top bar stay. False: every link loads the page in full.'
    navbar_sticky:
      type: boolean
      label: 'Keep the navbar at the top of the screen'
      description: 'True: the top bar stays in view while the page scrolls.'
    color_mode:
      type: string
      label: 'Color mode'
      description: 'auto follows the operating system of the person, light and dark force one mode for everyone.'
      constraints:
        Choice:
          - auto
          - light
          - dark
    density:
      type: string
      label: 'Density'
      description: 'How much room the rows, the panels and the fields take: comfortable, or compact for the people who work in the back office all day.'
      constraints:
        Choice:
          - comfortable
          - compact
    font_family:
      type: string
      label: 'Font'
      description: 'atkinson: the fonts of the theme, Atkinson Hyperlegible Next and Mono, served from the theme. system: the fonts of the operating system of the person.'
      constraints:
        Choice:
          - atkinson
          - system
    sticky_actions:
      type: boolean
      label: 'Keep the buttons of a form in reach'
      description: 'True: the Save row stays at the bottom of the screen while a long form scrolls.'
    edit_form_sidebar:
      type: boolean
      label: 'Put the meta of a content form in a sidebar'
      description: 'True: the authoring information, the revision log and the other advanced groups of a content form sit next to the fields.'
    sign_in_layout:
      type: string
      label: 'Sign-in layout'
      description: 'Where the form of the sign-in screens sits: center, start, end, top, bottom or spotlight.'
      constraints:
        # @see \Drupal\uikit_admin\Hook\PreprocessHooks::SIGN_IN_LAYOUTS
        Choice:
          - center
          - start
          - end
          - top
          - bottom
          - spotlight
    sign_in_message:
      type: label
      label: 'Sign-in message'
      description: 'A sentence shown with the site name on the sign-in screens.'
      constraints:
        Length:
          max: 160
    sign_in_header:
      type: boolean
      label: 'Show the header of the site on the sign-in screens'
      description: 'True: a slim bar with the site name and one level of the main menu above the screen.'
    sign_in_footer:
      type: boolean
      label: 'Show the footer of the site on the sign-in screens'
      description: 'True: a bar with the footer menu under the screen.'
    sign_in_logo:
      type: string
      label: 'Sign-in logo'
      description: 'site: the logo of the default theme of the site. theme: the logo of UIkit Admin. none: the site name only.'
      constraints:
        Choice:
          - site
          - theme
          - none
    sign_in_image:
      type: string
      label: 'Sign-in image'
      description: 'An image behind the brand panel: a path on the site (/sites/default/files/welcome.jpg), a stream wrapper URI (public://welcome.jpg) or an https address. Empty for none.'
    sign_in_image_credit:
      type: label
      label: 'Sign-in image credit'
      description: 'Who made the image, printed small in the brand panel.'
      constraints:
        Length:
          max: 160
    sign_in_help:
      type: label
      label: 'Sign-in help line'
      description: 'A short support line under the links of the sign-in screens.'
      constraints:
        Length:
          max: 160
    sign_in_page_layout:
      type: string
      label: 'Sign-in page layout'
      description: 'The id of a Display Builder page layout that draws the sign-in screens, like uikit_admin_sign_in. Empty: the layout of sign_in_layout.'
