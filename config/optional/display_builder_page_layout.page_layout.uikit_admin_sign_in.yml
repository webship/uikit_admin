langcode: en
status: false
dependencies:
  config:
    - display_builder.profile.uikit_admin_sign_in
  enforced:
    theme:
      - uikit_admin
  module:
    - display_builder_page_layout
    - system
    - ui_patterns
    - user
  theme:
    - uikit_admin
id: uikit_admin_sign_in
label: 'Sign-in screens (UIkit Admin)'
weight: -10
conditions:
  request_path:
    id: request_path
    negate: false
    pages: "/user/login\r\n/user/register\r\n/user/password\r\n/user/reset/*\r\n/user/logout/confirm"
  current_theme:
    id: current_theme
    negate: false
    theme: uikit_admin
profile: uikit_admin_sign_in
sources:
  -
    source_id: component
    source:
      component:
        component_id: 'uikit_admin:sign_in'
        variant_id: null
        props:
          layout:
            source_id: select
            source:
              value: center
          screen:
            source_id: select
            source:
              value: login
        slots:
          brand:
            sources:
              -
                source_id: block
                source:
                  plugin_id: system_branding_block
                  system_branding_block:
                    use_site_logo: true
                    use_site_name: true
                    use_site_slogan: false
          title:
            sources:
              -
                source_id: page_title
                source: {  }
          messages:
            sources:
              -
                source_id: block
                source:
                  plugin_id: system_messages_block
                  system_messages_block: {  }
          content:
            sources:
              -
                source_id: main_page_content
                source: {  }
          links:
            sources:
              -
                source_id: block
                source:
                  plugin_id: local_tasks_block
                  local_tasks_block:
                    primary: true
                    secondary: false
