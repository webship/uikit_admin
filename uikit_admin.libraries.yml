# UIkit itself, from the CDN by default. A site that serves it locally points
# the library at web/libraries/uikit through the theme setting.
uikit:
  remote: https://getuikit.com/
  version: 3.25.22
  license:
    name: MIT
    url: https://github.com/uikit/uikit/blob/develop/LICENSE.md
    gpl-compatible: true
  css:
    base:
      https://cdn.jsdelivr.net/npm/uikit@3.25.22/dist/css/uikit.min.css: { type: external, minified: true }
  js:
    https://cdn.jsdelivr.net/npm/uikit@3.25.22/dist/js/uikit.min.js: { type: external, minified: true }
    https://cdn.jsdelivr.net/npm/uikit@3.25.22/dist/js/uikit-icons.min.js: { type: external, minified: true }

uikit.local:
  version: 3.25.22
  license:
    name: MIT
    url: https://github.com/uikit/uikit/blob/develop/LICENSE.md
    gpl-compatible: true
  css:
    base:
      /libraries/uikit/dist/css/uikit.min.css: { minified: true }
  js:
    /libraries/uikit/dist/js/uikit.min.js: { minified: true }
    /libraries/uikit/dist/js/uikit-icons.min.js: { minified: true }

# The design tokens of the theme and the parts of the administration screens
# that UIkit does not cover on its own.
base:
  css:
    theme:
      assets/css/tokens.css: {}
      assets/css/admin.css: {}
      assets/css/shell.css: {}
  js:
    assets/js/shell.js: {}
  dependencies:
    - uikit_admin/uikit
    - core/drupal
    - core/once

messages:
  css:
    theme:
      assets/css/messages.css: {}

table:
  css:
    theme:
      assets/css/table.css: {}

# The administration toolbar of core keeps its own styles; this only aligns it
# with the UIkit navbar below it.
toolbar:
  css:
    theme:
      assets/css/toolbar.css: {}
