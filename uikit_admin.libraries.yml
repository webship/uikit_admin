# UIkit, compiled into the theme with its colors (assets/less/uikit-admin.less,
# "yarn build:uikit"). Nothing loads from a CDN.
uikit:
  remote: https://getuikit.com/
  version: 3.25.22
  license:
    name: MIT
    url: https://github.com/uikit/uikit/blob/develop/LICENSE.md
    gpl-compatible: true
  css:
    base:
      assets/vendor/uikit/css/uikit.css: {}
  js:
    assets/vendor/uikit/js/uikit.min.js: { minified: true }
    assets/vendor/uikit/js/uikit-icons.min.js: { minified: true }

# The design tokens of the theme and the parts of the administration screens
# that UIkit does not cover on its own.
base:
  css:
    theme:
      assets/css/tokens.css: {}
      assets/css/admin.css: {}
      assets/css/shell.css: {}
  js:
    assets/js/shell.js: {}
  dependencies:
    - uikit_admin/uikit
    - core/drupal
    - core/once

messages:
  css:
    theme:
      assets/css/messages.css: {}

table:
  css:
    theme:
      assets/css/table.css: {}

# The administration toolbar of core keeps its own styles; this only aligns it
# with the UIkit navbar below it.
toolbar:
  css:
    theme:
      assets/css/toolbar.css: {}

# HTMX navigation: the page wrapper is boosted with Drupal core HTMX, which
# loads the assets, the settings and the behaviors of the swapped page.
htmx:
  js:
    assets/js/htmx-navigation.js: {}
  css:
    theme:
      assets/css/htmx.css: {}
  dependencies:
    - core/drupal
    - core/drupal.announce
    - core/drupal.htmx
    - core/drupalSettings
