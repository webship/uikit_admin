name: 'UIkit Admin'
type: theme
description: 'The administration theme built with UIkit: every part of the administration screens is a single directory component. It stands on its own, with no base theme.'
core_version_requirement: ^11.4.8 || ^12
base theme: false
package: 'UIkit'
alt text: 'Screenshot of UIkit Admin, the UIkit administration theme.'
screenshot: screenshot.png
logo: logo.svg

# The administration regions, following the core administration theme, with the
# UIkit navbar and offcanvas of this theme on top.
regions:
  navbar_left: 'Navbar left'
  navbar_right: 'Navbar right'
  offcanvas: 'Offcanvas'
  breadcrumb: Breadcrumb
  header: Header
  pre_content: 'Pre-content'
  highlighted: Highlighted
  messages: 'Status messages'
  help: Help
  content: Content
  sidebar_first: 'Sidebar first'
  footer: Footer
  page_top: 'Page top'
  page_bottom: 'Page bottom'

regions_hidden:
  - sidebar_first
  - footer

libraries:
  - uikit_admin/uikit
  - uikit_admin/base

# Core uses the editor styles of the default theme only: these apply when
# UIkit Admin is also the default theme of the site.
ckeditor5-stylesheets:
  - assets/css/ckeditor5.css

# The administration screens of core print their own styles: the ones this
# theme replaces with UIkit are turned off here.
libraries-override:
  system/admin:
    css:
      theme:
        css/system.admin.css: false
  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false
  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: false

libraries-extend:
  core/drupal.message:
    - uikit_admin/messages
  core/drupal.tableheader:
    - uikit_admin/table
  core/drupal.dialog:
    - uikit_admin/dialog
  views_ui/admin.styling:
    - uikit_admin/views_ui
  ckeditor5/internal.drupal.ckeditor5:
    - uikit_admin/ckeditor5
